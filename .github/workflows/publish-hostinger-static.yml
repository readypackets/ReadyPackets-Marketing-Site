name: Publish Hostinger static branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-branch
  cancel-in-progress: false

jobs:
  publish:
    name: Build verified Hostinger static branch
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Build and validate static artifact
        run: |
          npm run build
          npm run validate

      - name: Publish deploy-only branch
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/assets/js/theme.js

          static_dir="$(mktemp -d)"
          cp -a dist/. "$static_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hostinger-static
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a "$static_dir/." .
          rm -rf "$static_dir"
          printf '%s\n' "$SOURCE_COMMIT" > .readypackets-source-commit
          git add --all
          git commit -m "deploy: static artifact from ${SOURCE_COMMIT}"
          git push --force origin HEAD:hostinger-static

      - name: Publish artifact for audit and rollback
        uses: actions/upload-artifact@v4
        with:
          name: ReadyPackets-Hostinger-Static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
